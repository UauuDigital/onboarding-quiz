<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UAUU – El vostre gran dia comença aquí</title>
    <!-- Meta Pixel Code -->

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@24/build/css/intlTelInput.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

    <div id="quiz-app">

        <nav class="quiz-nav">
            <div class="logo">
                <img src="logos/UAUU.png" alt="UAUU">
            </div>
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ca">CAT</button>
                <span class="sep">|</span>
                <button class="lang-btn" data-lang="es">ESP</button>
                <span class="sep">|</span>
                <button class="lang-btn" data-lang="en">ENG</button>
            </div>
        </nav>

        <main class="slides-container" id="slides-container">
            <!-- Slides rendered by quiz.js -->
        </main>

        <footer class="quiz-footer">
            <div class="nav-arrows">
                <button class="btn-nav btn-nav-up" id="btn-nav-up" aria-label="Enrere" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M3 10L8 5L13 10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="btn-nav btn-nav-down" id="btn-nav-down" aria-label="Continuar">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M3 6L8 11L13 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </footer>

    </div>

    <!-- Thank-you overlay (shown after CRM submit) -->
    <div id="thankyou-overlay" aria-live="polite">
        <div class="thankyou-card">
            <div class="thankyou-photo">
                <img src="https://uauu.cat/media/onboarding/festiu.webp" alt="">
            </div>
            <div class="thankyou-content">
                <p id="thankyou-msg" class="thankyou-msg"></p>
                <a class="btn-instagram" href="https://www.instagram.com/uauuweddings/" target="_blank" rel="noopener noreferrer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
                    </svg>
                    Segueix-nos a Instagram
                </a>
            </div>
        </div>
    </div>

    <!-- Hidden iframe: absorbs the CRM redirect so the page doesn't navigate away -->
    <iframe name="crm-iframe" style="display:none" aria-hidden="true" tabindex="-1"></iframe>

    <!-- CRM form (hidden, submitted at the final step) -->
    <form
        id="crm-form"
        action="https://crm.espaigastronomia.cat/index.php?entryPoint=WebToPersonCapture"
        method="POST"
        target="crm-iframe"
        style="display:none"
    >
        <input type="hidden" name="first_name"        id="crm-first_name">
        <input type="hidden" name="last_name"         id="crm-last_name">
        <input type="hidden" name="email1"            id="crm-email1">
        <input type="hidden" name="phone_mobile"      id="crm-phone_mobile">
        <input type="hidden" name="num_diners_c"      id="crm-num_diners_c">
        <input type="hidden" name="description"       id="crm-description">

        <input type="hidden" name="campaign_id"       value="837aea38-483f-e9a6-32dc-6a22cfcaf05e">
        <input type="hidden" name="redirect_url"      value="https://cataleg.uauu.cat/">
        <input type="hidden" name="assigned_user_id"  value="a622e474-8b6e-1ee8-bb2e-69d5f4e15f53">
        <input type="hidden" name="moduleDir"         value="Leads">
        <input type="hidden" name="event_type_c"      value="Casament">
        <input type="hidden" name="lead_source"       value="onboarding_quiz">
        <input type="hidden" name="idioma_contacto_c" id="crm-idioma_contacto_c" value="catala">

        <input type="text" name="hp_website" class="honeypot" tabindex="-1" autocomplete="off">

        <div id="recaptcha-container"
            class="g-recaptcha"
            data-sitekey="6LdUgHksAAAAADiH1j0npMbw-eH-5EPywowWgFAb"
            data-callback="onRecaptchaSuccess"
            data-size="invisible"
            data-badge="bottomleft">
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@24/build/js/intlTelInput.min.js"></script>
    <script src="js/crm.js"></script>
    <script src="js/quiz.js"></script>

</body>
</html>
